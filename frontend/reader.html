<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共读</title>
  <link rel="stylesheet" href="./reader.css">
</head>
<body data-theme="white" data-font="m" data-width="normal" data-line="loose" data-face="serif" data-para="indent" data-companions="on">

  <!-- 书架视图 -->
  <main id="shelfView" class="shelf">
    <header class="shelf-head">
      <h1>书库</h1>
      <nav class="shelf-actions">
        <button id="scanLocalBtn" class="text-btn" type="button">扫描本地书库</button>
        <a class="text-btn" href="/classic">完整模式</a>
      </nav>
    </header>
    <p id="shelfStatus" class="muted"></p>
    <ul id="bookList" class="book-list"></ul>
    <section id="localSection" class="local-section" hidden>
      <h2>本地书库</h2>
      <p id="localStatus" class="muted"></p>
      <ul id="localList" class="local-list"></ul>
    </section>
  </main>

  <!-- 阅读视图 -->
  <div id="readView" hidden>
    <header id="topbar">
      <button id="backBtn" class="text-btn" type="button">‹ 书架</button>
      <div id="topbarTitle" class="topbar-title"></div>
      <nav class="topbar-right">
        <span id="topbarProgress" class="muted"></span>
        <button id="sinkBtn" class="text-btn" type="button">沉淀<span id="sinkBadge" class="sink-badge" hidden></span></button>
        <button id="tocBtn" class="text-btn" type="button">目录</button>
        <button id="typoBtn" class="text-btn" type="button">Aa</button>
      </nav>
      <div class="topbar-progress-track"><div id="topbarProgressLine"></div></div>
    </header>

    <article id="flow" class="flow"></article>
    <p id="flowStatus" class="muted flow-status"></p>

    <!-- 目录抽屉 -->
    <div id="tocBackdrop" class="backdrop" hidden></div>
    <aside id="tocDrawer" class="toc-drawer" hidden>
      <header class="toc-head">
        <span>目录</span>
        <button id="tocCloseBtn" class="text-btn" type="button">关闭</button>
      </header>
      <ul id="tocList" class="toc-list"></ul>
    </aside>

    <!-- 排版设置弹层 -->
    <div id="typoPop" class="typo-pop" hidden>
      <div class="typo-row" data-setting="theme">
        <span class="typo-label">主题</span>
        <button class="theme-swatch" type="button" data-value="white" title="白" aria-label="白色主题"></button>
        <button class="theme-swatch" type="button" data-value="paper" title="纸" aria-label="纸色主题"></button>
        <button class="theme-swatch" type="button" data-value="dark" title="暗" aria-label="暗色主题"></button>
      </div>
      <div class="typo-row" data-setting="face">
        <span class="typo-label">字体</span>
        <button class="text-btn" type="button" data-value="serif">衬线</button>
        <button class="text-btn" type="button" data-value="sans">无衬线</button>
      </div>
      <div class="typo-row" data-setting="font">
        <span class="typo-label">字号</span>
        <button class="text-btn" type="button" data-value="s">小</button>
        <button class="text-btn" type="button" data-value="m">中</button>
        <button class="text-btn" type="button" data-value="l">大</button>
      </div>
      <div class="typo-row" data-setting="width">
        <span class="typo-label">页宽</span>
        <button class="text-btn" type="button" data-value="narrow">窄</button>
        <button class="text-btn" type="button" data-value="normal">适中</button>
        <button class="text-btn" type="button" data-value="wide">宽</button>
      </div>
      <div class="typo-row" data-setting="line">
        <span class="typo-label">行距</span>
        <button class="text-btn" type="button" data-value="normal">紧凑</button>
        <button class="text-btn" type="button" data-value="loose">舒朗</button>
      </div>
      <div class="typo-row" data-setting="para">
        <span class="typo-label">段落</span>
        <button class="text-btn" type="button" data-value="indent">缩进式</button>
        <button class="text-btn" type="button" data-value="space">段距式</button>
      </div>
      <div class="typo-row typo-row-companions" data-setting="companions" id="companionRow">
        <span class="typo-label">书友评论</span>
        <button class="text-btn" type="button" data-value="on">开</button>
        <button class="text-btn" type="button" data-value="off">关</button>
      </div>
      <p id="companionHint" class="typo-hint" hidden>未配置书友接口</p>
    </div>

    <!-- 选区工具条 -->
    <div id="selTool" class="sel-tool" hidden>
      <button id="selAskBtn" class="text-btn" type="button">问 Nova</button>
      <button id="selNoteBtn" class="text-btn" type="button">写想法</button>
      <button id="selTrailBtn" class="text-btn" type="button">追线索</button>
      <span id="selToolStatus" class="sel-tool-status" hidden></span>
    </div>

    <!-- 选区笔记/边注输入卡 -->
    <div id="noteCard" class="note-card" hidden>
      <p id="noteCardQuote" class="note-quote"></p>
      <textarea id="noteCardText" rows="3" placeholder="写下你的想法…"></textarea>
      <p id="noteCardStatus" class="muted note-status"></p>
      <div class="note-actions">
        <button id="noteSaveNoteBtn" class="text-btn" type="button">存笔记</button>
        <button id="noteSaveAnnotBtn" class="text-btn" type="button">存边注</button>
      </div>
    </div>

    <!-- 统一评论卡片（Nova / Phase 3 书友共用） -->
    <div id="commentCard" class="comment-card" hidden></div>

    <!-- 沉淀目标选择小弹层 -->
    <div id="sinkTargetPop" class="sink-target-pop" hidden>
      <p class="sink-target-title">沉淀到</p>
      <label class="sink-target-option"><input type="checkbox" value="obsidian">Obsidian</label>
      <label class="sink-target-option"><input type="checkbox" value="dailyNote">DailyNote</label>
      <label class="sink-target-option"><input type="checkbox" value="vcpMemory">VCPMemory</label>
      <p id="sinkTargetStatus" class="muted sink-target-status"></p>
      <div class="note-actions">
        <button id="sinkTargetConfirmBtn" class="text-btn" type="button">生成预览</button>
      </div>
    </div>

    <!-- 待沉淀箱抽屉 -->
    <div id="sinkBackdrop" class="backdrop" hidden></div>
    <aside id="sinkDrawer" class="sink-drawer" hidden>
      <header class="sink-head">
        <span>待沉淀</span>
        <button id="sinkCloseBtn" class="text-btn" type="button">关闭</button>
      </header>
      <p id="sinkDrawerStatus" class="muted sink-drawer-status"></p>
      <ul id="sinkList" class="sink-list"></ul>
    </aside>

    <!-- 选区追线索抽屉（复用待沉淀箱抽屉风格） -->
    <div id="trailBackdrop" class="backdrop" hidden></div>
    <aside id="trailDrawer" class="sink-drawer" hidden>
      <header class="sink-head">
        <span>线索</span>
        <button id="trailCloseBtn" class="text-btn" type="button">关闭</button>
      </header>
      <p id="trailSummary" class="muted trail-summary"></p>
      <ul id="trailList" class="trail-list"></ul>
    </aside>

    <!-- Nova 侧栏 -->
    <button id="novaStrip" class="nova-strip" type="button">Nova</button>
    <aside id="novaPanel" class="nova-panel" hidden>
      <header class="nova-head">
        <span class="nova-head-name">Nova<i class="nova-online" aria-hidden="true"></i></span>
        <span class="nova-head-actions">
          <button id="novaAutoBtn" class="text-btn nova-auto-btn" type="button" aria-pressed="true">自动预读</button>
          <button id="novaCloseBtn" class="text-btn" type="button">收起</button>
        </span>
      </header>
      <section id="novaHistory" class="nova-history"></section>
      <section class="nova-reply-wrap">
        <p id="novaReplyMeta" class="muted nova-reply-meta"></p>
        <div id="novaUserBubble" class="nova-user-bubble" hidden></div>
        <div class="nova-msg">
          <span class="nova-avatar" aria-hidden="true">N</span>
          <div id="novaReply" class="nova-reply"></div>
          <div id="novaReplyActions" class="nova-reply-actions" hidden>
            <button id="novaSaveNoteBtn" class="text-btn" type="button">存为笔记</button>
            <span class="muted">·</span>
            <button id="novaSinkBtn" class="text-btn sink-trigger" type="button">沉淀</button>
            <span id="novaActionStatus" class="muted"></span>
          </div>
        </div>
      </section>
      <footer class="nova-ask">
        <p id="novaStatus" class="muted nova-status"></p>
        <textarea id="novaPrompt" rows="3" placeholder="想问 Nova 什么？"></textarea>
        <button id="novaSendBtn" class="text-btn nova-send" type="button">发送</button>
      </footer>
    </aside>
  </div>

  <script src="./reader.js"></script>
</body>
</html>
